spring.application.name=profilak
spring.datasource.url=jdbc:postgresql://localhost:${PROFILAK_DB_PORT:15434}/profilak
spring.datasource.username=profilak
spring.datasource.password=${PROFILAK_DB_PASSWORD}
file.storage.location=${PROFILAK_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
